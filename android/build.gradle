allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.glance') {
                details.useVersion '1.1.1'
                details.because 'home_widget 0.9.0 declares androidx.glance:glance-appwidget:1.+; keep a stable Glance version compatible with AGP 8.7 and compileSdk 36.'
            }
        }
    }
}

// Workaround: Flutter 3.19.x does not propagate the flutter extension to plugin
// subprojects when using newer plugin versions (e.g. path_provider_android 2.2.19).
// Setting ext.flutter on all projects provides a fallback for flutter.compileSdkVersion.
// On :app the real FlutterExtension (registered by dev.flutter.flutter-gradle-plugin)
// takes precedence over ext, so there is no conflict.
class FlutterSdkStub {
    int compileSdkVersion = 36
    int minSdkVersion    = 21
    int targetSdkVersion = 34
}

// Apply only to plugin sub-projects; :app uses the real FlutterExtension from
// dev.flutter.flutter-gradle-plugin, which must not be shadowed.
subprojects { project ->
    if (project.name != 'app') {
        project.ext.flutter = new FlutterSdkStub()
    }
}

subprojects { project ->
    project.afterEvaluate {
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        project.tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = JavaVersion.VERSION_17.toString()
            targetCompatibility = JavaVersion.VERSION_17.toString()
        }

        def androidExtension = project.extensions.findByName('android')
        if (androidExtension != null && project.name != 'app') {
            androidExtension.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
